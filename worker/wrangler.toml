# Only needed if you deploy from a terminal with `npx wrangler deploy`.
# If you paste worker.js into the Cloudflare dashboard instead, you can ignore this file.
name = "gcse-marking"
main = "worker.js"
compatibility_date = "2026-10-01"

[vars]
SUPABASE_URL = "PASTE_PROJECT_URL"
SUPABASE_KEY = "PASTE_PUBLISHABLE_KEY"
ALLOWED_ORIGINS = "https://boblasticart.github.io"
ALLOWED_EMAILS = ""
# GEMINI_API_KEY is a secret: run `npx wrangler secret put GEMINI_API_KEY`
