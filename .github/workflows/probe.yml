name: probe
on: push
jobs:
  probe:
    if: github.ref == 'refs/heads/ci-probe'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm view next version && npm view @serwist/next version && npm view prisma version && psql postgresql://postgres:postgres@localhost:5432/postgres -c 'select version()'
